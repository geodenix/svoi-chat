<body>
<div id="auth" class="auth">
  <div class="auth-card"><div class="brand"><div class="mark">С</div><div><h1>Свои</h1><div class="muted">приватный мессенджер</div></div></div>
    <div class="tabs"><button id="tabLogin" class="active">Войти</button><button id="tabRegister">Регистрация</button></div>
    <form id="authForm">
      <div id="nameField" class="field hidden"><label>Имя</label><input id="displayName" maxlength="60" autocomplete="name"></div>
      <div class="field"><label>Логин</label><input id="username" maxlength="32" autocomplete="username" required></div>
      <div class="field"><label>Пароль</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div>
      <button id="authSubmit" class="primary" style="width:100%">Войти</button><div id="authError" class="error"></div>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="side-head"><button id="meAvatar" class="profile-avatar" type="button" title="Изменить аватар">С</button><input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><div class="me"><strong id="meName"></strong><small id="meUser" class="muted"></small></div><button id="notifyBtn" class="logout" type="button" title="Включить уведомления">🔔</button><button id="logout" class="logout">Выйти</button></div>
    <div class="scroll">
      <div id="installBox" class="install-box"><button id="installBtn" class="install-app" type="button">📲 Установить «Свои»</button></div>
      <div class="section-head"><span>Звонки</span></div>
      <div id="calls" class="call-list"></div>
      <div class="section-head"><span>Группы</span><button id="newGroup" class="new-group">+ Новая</button></div>
      <div id="groups" class="list"></div>
      <div class="section-head"><span>Личные чаты</span></div>
      <div class="user-search">
        <form id="userSearchForm" class="user-search-form">
          <input id="userSearchInput" maxlength="33" autocomplete="off" placeholder="Найти по @тегу">
          <button type="submit">Найти</button>
        </form>
        <div id="userSearchResult" class="user-search-result"></div>
      </div>
      <div id="users" class="list"></div>
    </div>
  </aside>

  <main class="chat">
    <div id="chatHead" class="chat-head hidden"><button id="back" class="back">←</button><div class="avatar" id="chatAvatar"></div><div class="chat-title"><strong id="chatName"></strong><small id="chatStatus" class="muted"></small></div><div id="callActions" class="call-actions hidden"><button id="audioCallBtn" class="call-btn" type="button" title="Голосовой звонок">📞</button><button id="videoCallBtn" class="call-btn" type="button" title="Видеозвонок">🎥</button></div></div>
    <div id="messages" class="messages"><div class="welcome"><div class="mark">С</div><h2>Выбери чат</h2><p>Личные и групповые сообщения приходят в реальном времени.</p></div></div>
    <div id="pendingFile" class="pending-file hidden"><span id="pendingFileName"></span><button id="removeFile" type="button">×</button></div>
    <form id="composer" class="composer hidden"><button id="attach" class="attach" type="button" aria-label="Прикрепить файл">📎</button><input id="fileInput" type="file" hidden><textarea id="text" placeholder="Сообщение…" maxlength="4000" rows="1"></textarea><button id="send" class="send" disabled>↑</button></form>
  </main>
</div>

<div id="groupCallOverlay" class="group-call-overlay hidden">
  <div class="group-call-head">
    <button id="groupCallBack" class="back" type="button" style="display:block">←</button>
    <div><strong id="groupCallName">Групповой звонок</strong><small id="groupCallStatus" class="muted">Подключение…</small></div>
  </div>
  <div id="groupCallGrid" class="group-call-grid"></div>
  <div class="group-call-controls">
    <button id="groupMuteBtn" type="button" title="Микрофон">🎤</button>
    <button id="groupCameraBtn" type="button" title="Камера">📷</button>
    <button id="groupSwitchCameraBtn" type="button" title="Сменить камеру">🔄</button>
    <button id="groupEndBtn" class="end" type="button" title="Выйти">☎</button>
  </div>
</div>

<div id="callOverlay" class="call-overlay hidden">
  <div class="call-shell">
    <div class="call-stage">
      <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
      <div id="callAvatar" class="call-avatar">С</div>
      <video id="localVideo" class="local-video hidden" autoplay muted playsinline></video>
      <div class="call-info"><strong id="callName">Звонок</strong><span id="callStatus">Соединение…</span></div>
    </div>
    <div id="incomingActions" class="incoming-actions hidden">
      <button id="rejectCall" class="reject-call" type="button" title="Отклонить">✕</button>
      <button id="acceptCall" class="accept-call" type="button" title="Принять">✓</button>
    </div>
    <div id="mediaPermission" class="media-permission hidden">
      <button id="mediaPermissionBtn" type="button">Разрешить камеру и микрофон</button>
      <small id="mediaPermissionText">Нужен доступ для видеозвонка</small>
    </div>
    <div id="activeCallControls" class="call-controls hidden">
      <button id="muteCall" class="round-call" type="button" title="Микрофон">🎤</button>
      <button id="cameraCall" class="round-call" type="button" title="Камера">📷</button>
      <button id="switchCamera" class="round-call" type="button" title="Сменить камеру">🔄</button>
      <button id="endCall" class="round-call end" type="button" title="Завершить">☎</button>
    </div>
  </div>
</div>

<dialog id="groupDialog">
  <h2 class="dialog-title">Новая группа</h2>
  <p class="muted">Укажи название и выбери участников.</p>
  <input id="groupName" class="group-name" maxlength="80" placeholder="Название группы">
  <div id="memberList" class="member-list"></div>
  <div class="dialog-actions"><button id="cancelGroup">Отмена</button><button id="createGroup" class="primary">Создать</button></div>
  <div id="groupError" class="error"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let mode='login',token=localStorage.getItem('svoi_token')||'',me=null,users=[],groups=[],callHistory=[],active=null,socket=null,retry=null,pendingAttachment=null,uploading=false,foundUser=null;
let currentCall=null,pendingCall=null,pendingIce=[],cameraFacing='user',acceptingCall=false,preparedMediaStream=null;
let deferredInstallPrompt=null;
let groupCallState=null;

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone===true
}

function updateInstallUi(){
  $('installBox').classList.toggle('hidden',isStandalone())
}

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  updateInstallUi()
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  $('installBox').classList.add('hidden')
});

$('installBtn').onclick=async()=>{
  if(isStandalone()){
    $('installBox').classList.add('hidden');
    return
  }
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice}catch{}
    deferredInstallPrompt=null;
    updateInstallUi();
    return
  }
  alert('Открой меню браузера ⋮ и выбери «Добавить на главный экран». После установки «Свои» будет запускаться как отдельное приложение.')
};

updateInstallUi();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js')
    .then(registration=>registration.update().catch(()=>{}))
    .catch(()=>{})
}

const api=async(path,opt={})=>{
  opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};
  if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
  const r=await fetch(path,opt);let data=null;try{data=await r.json()}catch{}
  if(!r.ok){const err=new Error(data?.detail||'Ошибка сервера');err.status=r.status;throw err}
  return data
};

function setMode(next){
  mode=next;const reg=next==='register';
  $('tabLogin').classList.toggle('active',!reg);$('tabRegister').classList.toggle('active',reg);
  $('nameField').classList.toggle('hidden',!reg);$('authSubmit').textContent=reg?'Создать аккаунт':'Войти';
  $('password').autocomplete=reg?'new-password':'current-password';$('authError').textContent=''
}
$('tabLogin').onclick=()=>setMode('login');$('tabRegister').onclick=()=>setMode('register');

$('authForm').onsubmit=async e=>{
  e.preventDefault();$('authError').textContent='';
  try{
    const body={username:$('username').value.trim(),password:$('password').value};
    if(mode==='register')body.display_name=$('displayName').value.trim();
    const data=await api(mode==='register'?'/api/register':'/api/login',{method:'POST',body});
    token=data.token;localStorage.setItem('svoi_token',token);await enter()
  }catch(err){$('authError').textContent=err.message}
};

function formatCallDuration(seconds){
  const s=Math.max(0,Number(seconds)||0);
  if(!s)return '';
  if(s<60)return s+' сек.';
  const minutes=Math.floor(s/60);
  const rest=s%60;
  return rest?minutes+' мин '+rest+' сек':minutes+' мин'
}

function formatCallTime(value){
  if(!value)return '';
  const date=new Date(value);
  const now=new Date();
  const sameDay=date.toDateString()===now.toDateString();
  return sameDay
    ?date.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})
    :date.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
}

function callStatusText(call){
  const direction=call.direction==='incoming'?'Входящий':'Исходящий';
  if(call.status==='missed'){
    return call.direction==='incoming'?'Пропущенный':'Без ответа'
  }
  if(call.status==='rejected'){
    return call.direction==='incoming'?'Отклонён вами':'Отклонён'
  }
  if(call.status==='completed'){
    const duration=formatCallDuration(call.duration_seconds);
    return direction+(duration?' · '+duration:'')
  }
  if(call.status==='answered')return direction+' · соединён';
  return direction+' · вызов'
}

function userForCall(call){

}

function urlBase64ToUint8Array(value){
  const padding='='.repeat((4-value.length%4)%4);
  const base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(ch=>ch.charCodeAt(0)))
}

async function ensurePushSubscription(registration){
  const config=await api('/api/push/public-key');
  if(!config.configured||!config.public_key)throw new Error('Push-уведомления пока не настроены на сервере');
  let sub=await registration.pushManager.getSubscription();
  if(!sub){
    sub=await registration.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(config.public_key)
    })
  }
  await api('/api/push/subscribe',{method:'POST',body:sub.toJSON()});
  $('notifyBtn').textContent='✅';$('notifyBtn').title='Уведомления включены — нажми для теста';
  return sub
}

async function initPush(){
  const btn=$('notifyBtn');
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    btn.classList.add('hidden');return
  }
  const registration=await navigator.serviceWorker.register('/sw.js');
  try{await registration.update()}catch{}
  if(Notification.permission==='granted'){
    await ensurePushSubscription(registration)
  }else if(Notification.permission==='denied'){
    btn.textContent='🔕';btn.title='Уведомления запрещены в настройках браузера'
  }else{
    btn.textContent='🔔';btn.title='Включить уведомления'
  }
}

$('notifyBtn').onclick=async()=>{
  try{
    if(!('Notification' in window))throw new Error('Этот браузер не поддерживает уведомления');
    if(Notification.permission==='denied')throw new Error('Разреши уведомления для этого сайта в настройках браузера');
    const permission=Notification.permission==='granted'
      ?'granted'
      :await Notification.requestPermission();
    if(permission!=='granted')return;
    const registration=await navigator.serviceWorker.ready;
    await ensurePushSubscription(registration);
    const result=await api('/api/push/test',{method:'POST'});
    $('notifyBtn').textContent='✅';
    $('notifyBtn').title='Тестовый push отправлен. Подписок: '+result.attempted
  }catch(err){
    $('notifyBtn').textContent='⚠️';
    $('notifyBtn').title='Ошибка push';
    alert(err.message)
  }
};

async function removePushSubscription(){
  if(!('serviceWorker' in navigator))return;
  try{
    const registration=await navigator.serviceWorker.ready;
    const sub=await registration.pushManager.getSubscription();
    if(!sub)return;
    try{await api('/api/push/unsubscribe',{method:'POST',body:sub.toJSON()})}catch{}
    await sub.unsubscribe()
  }catch{}
}

function groupTileId(identity){
  return 'group-tile-'+String(identity).replace(/[^a-zA-Z0-9_-]/g,'_')

function ensureGroupTile(participant,isLocal=false){

  const id=groupTileId(identity);

  if(tile)return tile;

  tile=document.createElement('div');
  tile.id=id;tile.className='group-tile';

  tile.append(avatar,name);

function attachGroupTrack(track,participant,isLocal=false){
  const tile=ensureGroupTile(participant,isLocal);
  if(track.kind===LivekitClient.Track.Kind.Video){
    tile.querySelector('.tile-avatar')?.classList.add('hidden');
    const element=track.attach();
    element.autoplay=true;element.playsInline=true;
    if(isLocal)element.muted=true;
    for(const old of tile.querySelectorAll('video'))old.remove();
    tile.prepend(element)
  }else if(track.kind===LivekitClient.Track.Kind.Audio){
    const element=track.attach();
    element.autoplay=true;element.style.display='none';
    tile.append(element)
  }
}

function detachGroupTrack(track){
  try{track.detach().forEach(el=>el.remove())}catch{}
}

  }

function setGroupCallStatus(text){
  if(groupCallState)$('groupCallStatus').textContent=text

async function recoverGroupCall(state){
  if(!state||groupCallState!==state||state.manualLeave||state.recovering)return;
  state.recovering=true;
  state.reconnectAttempts=(state.reconnectAttempts||0)+1;

  if(state.reconnectAttempts>5){
    setGroupCallStatus('Не удалось восстановить соединение');
    state.recovering=false;
    return
  }

  const delay=Math.min(8000,1500*state.reconnectAttempts);
  setGroupCallStatus('Восстанавливаем соединение…');
  await new Promise(resolve=>setTimeout(resolve,delay));

  if(groupCallState!==state||state.manualLeave){
    state.recovering=false;
    return
  }

  if(!navigator.onLine){
    state.recovering=false;
    setGroupCallStatus('Нет интернета · ждём сеть');
    return
  }

  try{
    const credentials=await api('/api/groups/'+state.groupId+'/call-token',{
      method:'POST',
      body:{video:!!state.video,invite:false}
    });

    await state.room.connect(
      credentials.server_url,
      credentials.participant_token
    );

    await state.room.localParticipant.setMicrophoneEnabled(!state.muted);
    await state.room.localParticipant.setCameraEnabled(!state.cameraOff);
    if(!state.cameraOff){
      let track=null;
      for(const pub of state.room.localParticipant.videoTrackPublications.values()){
        if(pub.track){track=pub.track;break}
      }
      if(track&&state.facing){
        try{await track.restartTrack({facingMode:state.facing})}catch{}
      }
    }

    state.reconnectAttempts=0;
    state.needsRecovery=false;
    state.recovering=false;
    await renderGroupLocalTracks();
    refreshGroupCount()
  }catch(err){
    state.recovering=false;
    state.needsRecovery=true;
    recoverGroupCall(state).catch(()=>{})
  }
}

async function renderGroupLocalTracks(){
  if(!groupCallState?.room)return;
  const p=groupCallState.room.localParticipant;
  const tile=ensureGroupTile(p,true);
  let hasVideo=false;
  for(const pub of p.videoTrackPublications.values()){
    if(pub.track){
      attachGroupTrack(pub.track,p,true);hasVideo=true;break
    }
  }
  tile.querySelector('.tile-avatar')?.classList.toggle('hidden',hasVideo)
}

async function joinGroupCall(groupId,video=false,invite=false){
  if(groupCallState)return;
  if(currentCall||pendingCall){
    alert('Сначала заверши текущий личный звонок');return
  }
  if(!window.LivekitClient){
    alert('Модуль групповых звонков не загрузился');return
  }

  let room=null;
  try{
    const credentials=await api('/api/groups/'+groupId+'/call-token',{
      method:'POST',
      body:{video:!!video,invite:!!invite}
    });

    room=new LivekitClient.Room({
      adaptiveStream:true,
      dynacast:true,
      videoCaptureDefaults:{
        resolution:LivekitClient.VideoPresets.h720.resolution
      }
    });

    groupCallState={
      room,
      groupId,
      video:!!video,
      muted:false,
      cameraOff:!video,
      facing:'user',
      reconnectAttempts:0,
      recovering:false,
      needsRecovery:false,
      manualLeave:false
    };

    $('groupCallGrid').replaceChildren();
    $('groupCallName').textContent=credentials.group_name;
    $('groupCallStatus').textContent='Подключение…';
    $('groupCallOverlay').classList.remove('hidden');
    $('groupCameraBtn').classList.toggle('off',!video);
    $('groupSwitchCameraBtn').classList.toggle('hidden',!video);

    room
      .on(LivekitClient.RoomEvent.TrackSubscribed,(track,_publication,participant)=>{
        attachGroupTrack(track,participant,false);refreshGroupCount()
      })
      .on(LivekitClient.RoomEvent.TrackUnsubscribed,(track)=>{
        detachGroupTrack(track)
      })
      .on(LivekitClient.RoomEvent.ParticipantConnected,(participant)=>{
        ensureGroupTile(participant,false);refreshGroupCount()
      })
      .on(LivekitClient.RoomEvent.ParticipantDisconnected,(participant)=>{
        $(groupTileId(participant.identity))?.remove();refreshGroupCount()
      })
      .on(LivekitClient.RoomEvent.ActiveSpeakersChanged,(speakers)=>{
        updateGroupActiveSpeakers(speakers)
      })
      .on(LivekitClient.RoomEvent.Reconnecting,()=>{
        if(groupCallState?.room===room){
          groupCallState.needsRecovery=false;
          setGroupCallStatus('Восстанавливаем соединение…')
        }
      })
      .on(LivekitClient.RoomEvent.Reconnected,()=>{
        if(groupCallState?.room===room){
          groupCallState.reconnectAttempts=0;
          groupCallState.recovering=false;
          groupCallState.needsRecovery=false;
          refreshGroupCount()
        }
      })
      .on(LivekitClient.RoomEvent.Disconnected,()=>{
        const state=groupCallState;
        if(!state||state.room!==room||state.manualLeave)return;
        state.needsRecovery=true;
        setGroupCallStatus(
          navigator.onLine
            ?'Связь потеряна · переподключаемся…'
            :'Нет интернета · ждём сеть'
        );
        if(navigator.onLine)recoverGroupCall(state).catch(()=>{})
      });

    await room.connect(
      credentials.server_url,
      credentials.participant_token
    );

    ensureGroupTile(room.localParticipant,true);
    for(const participant of room.remoteParticipants.values()){
      ensureGroupTile(participant,false)
    }

    await room.localParticipant.setMicrophoneEnabled(true);
    if(video)await room.localParticipant.setCameraEnabled(true);

    await renderGroupLocalTracks();
    refreshGroupCount()
  }catch(err){
    try{room?.disconnect()}catch{}
    groupCallState=null;
    $('groupCallOverlay').classList.add('hidden');
    alert(err?.message||'Не удалось подключиться к групповому звонку')
  }
}

let rtcConfigCache=null,rtcConfigFetchedAt=0;

async function getRtcConfig(){
  const now=Date.now();
  if(rtcConfigCache&&now-rtcConfigFetchedAt<30*60*1000)return rtcConfigCache;
  try{
    const data=await api('/api/turn');
    rtcConfigCache={
      iceServers:data.ice_servers||[
        {urls:['stun:stun.l.google.com:19302']}
      ]
    };
  }catch{
    rtcConfigCache={
      iceServers:[
        {urls:['stun:stun.l.google.com:19302']},
        {urls:['stun:stun1.l.google.com:19302']}
      ]
    };
  }
  rtcConfigFetchedAt=now;
  return rtcConfigCache
}

function wsSend(payload){
  if(!socket||socket.readyState!==WebSocket.OPEN)throw new Error('Нет соединения с сервером');
  socket.send(JSON.stringify(payload))
}

function callId(){return crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(16).slice(2))}

function showCallUi(name,status,video,incoming=false){
  $('callOverlay').classList.remove('hidden');$('callName').textContent=name||'Звонок';$('callStatus').textContent=status;
  $('callAvatar').textContent=initials(name||'С');$('callAvatar').classList.toggle('hidden',video);
  $('localVideo').classList.toggle('hidden',!video);
  $('incomingActions').classList.toggle('hidden',!incoming);
  $('activeCallControls').classList.toggle('hidden',incoming);
  $('cameraCall').classList.toggle('hidden',!video);$('switchCamera').classList.toggle('hidden',!video)
}

function resetCallUi(){
  $('callOverlay').classList.add('hidden');$('remoteVideo').srcObject=null;$('localVideo').srcObject=null;
  $('incomingActions').classList.add('hidden');$('activeCallControls').classList.add('hidden');$('mediaPermission').classList.add('hidden');
  $('muteCall').classList.remove('off');$('cameraCall').classList.remove('off');
  if(preparedMediaStream){try{preparedMediaStream.getTracks().forEach(t=>t.stop())}catch{}preparedMediaStream=null}
}

async function getCallMedia(video){
  const request=navigator.mediaDevices.getUserMedia({
    audio:true,
    video:video?{facingMode:{ideal:cameraFacing}}:false
  });
  const timeout=new Promise((_,reject)=>setTimeout(()=>{
    const err=new Error(video?'Камера не ответила. Проверь разрешение камеры.':'Микрофон не ответил. Проверь разрешение.');
    err.name='MediaTimeoutError';reject(err)
  },12000));
  return Promise.race([request,timeout])
}

async function createPeer(peerId,peerName,id,video,stream){
  const config=await getRtcConfig();
  const pc=new RTCPeerConnection(config);
  currentCall={pc,peerId,peerName,callId:id,video,localStream:stream,muted:false,cameraOff:false};
  for(const track of stream.getTracks())pc.addTrack(track,stream);
  $('localVideo').srcObject=stream;
  pc.ontrack=e=>{
    const stream=e.streams?.[0];
    if(stream){
      $('remoteVideo').srcObject=stream;
      $('remoteVideo').play().catch(()=>{})
    }
    $('callStatus').textContent='Соединено'
  };
  pc.onicecandidate=e=>{
    if(!e.candidate||!currentCall)return;
    try{wsSend({type:'ice_candidate',to_user_id:peerId,call_id:id,candidate:e.candidate.toJSON()})}catch{}
  };
  pc.onconnectionstatechange=()=>{
    if(!currentCall||currentCall.pc!==pc)return;
    const state=pc.connectionState;
    if(state==='connected')$('callStatus').textContent='Соединено';
    else if(state==='connecting')$('callStatus').textContent='Соединение…';
    else if(state==='failed'){ $('callStatus').textContent='Не удалось соединиться'; setTimeout(()=>finishCall(false),1200) }
    else if(state==='closed')finishCall(false)
  };
  return pc
}

async function flushPendingIce(){
  if(!currentCall?.pc?.remoteDescription)return;
  const list=pendingIce.splice(0);
  for(const candidate of list){
    try{await currentCall.pc.addIceCandidate(new RTCIceCandidate(candidate))}catch{}
  }
}

async function startCallTo(u,video){
  if(!u||currentCall||pendingCall)return;
  if(!navigator.mediaDevices?.getUserMedia){alert('Браузер не поддерживает звонки');return}
  try{
    await waitForSocketOpen();
    const stream=await getCallMedia(video);
    const id=callId();pendingIce=[];
    const pc=await createPeer(u.id,u.display_name,id,video,stream);
    showCallUi(u.display_name,'Вызов…',video,false);
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    wsSend({type:'call_offer',to_user_id:u.id,call_id:id,video,sdp:pc.localDescription.toJSON?pc.localDescription.toJSON():pc.localDescription})
  }catch(err){
    finishCall(false);
    alert(err.name==='NotAllowedError'?'Нужен доступ к микрофону/камере':(err.message||'Не удалось начать звонок'))
  }
}

async function startCall(video){
  if(active?.type!=='user')return;
  return startCallTo(active.data,video)
}

function incomingCall(data){
  if(currentCall?.callId===data.call_id||pendingCall?.call_id===data.call_id){
    if(Array.isArray(data.ice_candidates)){
      pendingIce.push(...data.ice_candidates)
    }
    return
  }
  if(currentCall||pendingCall){
    try{wsSend({type:'call_reject',to_user_id:data.from_user_id,call_id:data.call_id})}catch{}
    return
  }
  pendingIce=Array.isArray(data.ice_candidates)
    ?data.ice_candidates.slice()
    :[];
  pendingCall=data;preparedMediaStream=null;
  showCallUi(data.from_name,data.video?'Входящий видеозвонок':'Входящий голосовой звонок',data.video,true);
  $('mediaPermission').classList.toggle('hidden',!data.video);
  if(data.video){
    $('mediaPermissionText').textContent='Нужен доступ к камере и микрофону';
    $('mediaPermissionBtn').textContent='Разрешить камеру и микрофон';
    $('mediaPermissionBtn').disabled=false
  }
}

async function requestIncomingMediaPermission(){
  if(!pendingCall?.video)return;
  $('mediaPermissionBtn').disabled=true;
  $('mediaPermissionText').textContent='Запрашиваем доступ…';
  try{
    const stream=await getCallMedia(true);
    if(preparedMediaStream){
      try{preparedMediaStream.getTracks().forEach(t=>t.stop())}catch{}
    }
    preparedMediaStream=stream;
    $('mediaPermissionText').textContent='Доступ получен — нажми ✓';
    $('mediaPermissionBtn').textContent='Камера разрешена ✅';
    $('localVideo').srcObject=stream;$('localVideo').classList.remove('hidden');
    $('localVideo').play().catch(()=>{})
  }catch(err){
    $('mediaPermissionBtn').disabled=false;
    $('mediaPermissionBtn').textContent='Попробовать снова';
    if(err.name==='NotAllowedError'){
      $('mediaPermissionText').textContent='Камера/микрофон запрещены в настройках браузера для этого сайта'
    }else{
      $('mediaPermissionText').textContent=err.message||'Не удалось открыть камеру'
    }
  }
}

$('mediaPermissionBtn').onclick=requestIncomingMediaPermission;

async function acceptIncomingCall(){
  if(!pendingCall||acceptingCall)return;
  acceptingCall=true;
  const data=pendingCall;
  $('acceptCall').disabled=true;$('rejectCall').disabled=true;
  showCallUi(
    data.from_name,
    data.video?'Подключаем камеру…':'Подключаем микрофон…',
    !!data.video,
    false
  );
  try{
    const stream=preparedMediaStream||await getCallMedia(!!data.video);
    preparedMediaStream=null;
    if(!pendingCall||pendingCall.call_id!==data.call_id){
      stream.getTracks().forEach(t=>t.stop());
      return
    }
    const pc=await createPeer(
      data.from_user_id,
      data.from_name,
      data.call_id,
      !!data.video,
      stream
    );
    pendingCall=null;
    $('mediaPermission').classList.add('hidden');
    $('callStatus').textContent='Соединение…';
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    await flushPendingIce();
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitForSocketOpen();
    wsSend({
      type:'call_answer',
      to_user_id:data.from_user_id,
      call_id:data.call_id,
      video:!!data.video,
      sdp:pc.localDescription.toJSON?pc.localDescription.toJSON():pc.localDescription
    })
  }catch(err){
    try{wsSend({type:'call_reject',to_user_id:data.from_user_id,call_id:data.call_id})}catch{}
    finishCall(false);
    const message=err.name==='NotAllowedError'
      ?'Нужен доступ к микрофону и камере'
      :(err.message||'Не удалось принять звонок');
    alert(message)
  }finally{
    acceptingCall=false;
    $('acceptCall').disabled=false;$('rejectCall').disabled=false
  }
}

async function rejectIncomingCall(){
  if(!pendingCall||acceptingCall)return;
  const data=pendingCall;
  try{
    await waitForSocketOpen();
    wsSend({type:'call_reject',to_user_id:data.from_user_id,call_id:data.call_id})
  }catch{}
  pendingCall=null;pendingIce=[];resetCallUi();
  setTimeout(()=>loadCallHistory().catch(()=>{}),500)
}

function finishCall(notify=true){
  if(notify&&currentCall){
    try{wsSend({type:'call_end',to_user_id:currentCall.peerId,call_id:currentCall.callId})}catch{}
  }else if(notify&&pendingCall){
    try{wsSend({type:'call_reject',to_user_id:pendingCall.from_user_id,call_id:pendingCall.call_id})}catch{}
  }
  if(currentCall){
    try{currentCall.pc.onicecandidate=null;currentCall.pc.ontrack=null;currentCall.pc.close()}catch{}
    try{currentCall.localStream?.getTracks().forEach(t=>t.stop())}catch{}
  }
  acceptingCall=false;currentCall=null;pendingCall=null;pendingIce=[];resetCallUi();
  setTimeout(()=>loadCallHistory().catch(()=>{}),500)
}

async function handleCallSignal(data){
  if(data.type==='call_offer'){incomingCall(data);return}
  if(data.type==='call_unavailable'){
    if(currentCall&&currentCall.callId===data.call_id){alert('Пользователь сейчас недоступен');finishCall(false)}
    return
  }
  if(data.type==='call_reject'){
    if(currentCall&&currentCall.callId===data.call_id){$('callStatus').textContent='Звонок отклонён';setTimeout(()=>finishCall(false),900)}
    return
  }
  if(data.type==='call_end'){
    if((currentCall&&currentCall.callId===data.call_id)||(pendingCall&&pendingCall.call_id===data.call_id)){finishCall(false)}
    return
  }
  if(data.type==='ice_candidate'){
    if(currentCall&&currentCall.callId===data.call_id&&currentCall.pc.remoteDescription){
      try{await currentCall.pc.addIceCandidate(new RTCIceCandidate(data.candidate))}catch{}
    }else if((currentCall&&currentCall.callId===data.call_id)||(pendingCall&&pendingCall.call_id===data.call_id)){
      pendingIce.push(data.candidate)
    }
    return
  }
  if(data.type==='call_answer'){
    if(!currentCall||currentCall.callId!==data.call_id)return;
    try{
      await currentCall.pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      await flushPendingIce();$('callStatus').textContent='Соединение…'
    }catch{finishCall(false)}
  }
}

$('switchCamera').onclick=async()=>{
  if(!currentCall?.video)return;
  const button=$('switchCamera');
  button.disabled=true;

  const oldTrack=currentCall.localStream.getVideoTracks()[0];
  const oldFacing=cameraFacing;
  const nextFacing=oldFacing==='user'?'environment':'user';

  try{
    let devices=[];
    try{
      devices=(await navigator.mediaDevices.enumerateDevices())
        .filter(device=>device.kind==='videoinput')
    }catch{}

    if(devices.length===1){
      throw new Error('Браузер видит только одну камеру')
    }

    const oldSettings=oldTrack?.getSettings?.()||{};
    const currentDeviceId=oldSettings.deviceId||'';
    let targetDevice=null;

    if(devices.length>1){
      targetDevice=devices.find(device=>
        device.deviceId &&
        device.deviceId!==currentDeviceId &&
        (
          nextFacing==='environment'
            ? /back|rear|environment|зад/i.test(device.label||'')
            : /front|user|face|перед/i.test(device.label||'')
        )
      ) || devices.find(device=>
        device.deviceId && device.deviceId!==currentDeviceId
      )
    }

    if(oldTrack){
      oldTrack.enabled=false;
      oldTrack.stop();
      currentCall.localStream.removeTrack(oldTrack)
    }

    let constraints;
    if(targetDevice?.deviceId){
      constraints={video:{deviceId:{exact:targetDevice.deviceId}},audio:false}
    }else{
      constraints={video:{facingMode:{exact:nextFacing}},audio:false}
    }

    let newStream;
    try{
      newStream=await navigator.mediaDevices.getUserMedia(constraints)
    }catch(firstError){
      newStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:nextFacing}},
        audio:false
      })
    }

    const newTrack=newStream.getVideoTracks()[0];
    if(!newTrack)throw new Error('Новая камера не открылась');

    const sender=currentCall.pc.getSenders().find(s=>s.track?.kind==='video');
    if(!sender)throw new Error('Видеотрек звонка не найден');

    await sender.replaceTrack(newTrack);
    currentCall.localStream.addTrack(newTrack);
    cameraFacing=nextFacing;

    $('localVideo').srcObject=currentCall.localStream;
    $('localVideo').play().catch(()=>{})
  }catch(err){
    try{
      const restore=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:oldFacing}},
        audio:false
      });
      const restoreTrack=restore.getVideoTracks()[0];
      const sender=currentCall?.pc?.getSenders().find(s=>s.track?.kind==='video');
      if(sender&&restoreTrack){
        await sender.replaceTrack(restoreTrack);
        currentCall.localStream.addTrack(restoreTrack);
        $('localVideo').srcObject=currentCall.localStream;
        $('localVideo').play().catch(()=>{})
      }
    }catch{}
    alert(err.message||'Не удалось переключить камеру')
  }finally{
    button.disabled=false
  }
};

function waitForSocketOpen(timeoutMs=6000){
  if(socket?.readyState===WebSocket.OPEN)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const started=Date.now();
    const timer=setInterval(()=>{
      if(socket?.readyState===WebSocket.OPEN){
        clearInterval(timer);resolve();return
      }
      if(Date.now()-started>=timeoutMs){
        clearInterval(timer);reject(new Error('Нет соединения с сервером'))
      }
    },80)
  })
}

function connectWs(){
  if(socket)socket.close();const proto=location.protocol==='https:'?'wss':'ws';
  socket=new WebSocket(proto+'://'+location.host+'/ws?token='+encodeURIComponent(token));
  socket.onmessage=e=>{
    const data=JSON.parse(e.data);
    if(['call_offer','call_answer','ice_candidate','call_reject','call_end','call_unavailable'].includes(data.type)){
      handleCallSignal(data);return
    }
    if(data.type==='group_call_invite'){
      if(!groupCallState&&confirm(data.from_name+' зовёт в групповой '+(data.video?'видеозвонок':'звонок')+' «'+data.group_name+'». Присоединиться?')){
        joinGroupCall(data.group_id,!!data.video,false)
      }
      return
    }
    if(data.type==='profile_updated'){
      if(data.user?.id===me?.id){
        me=data.user;$('meName').textContent=me.display_name;$('meUser').textContent='@'+me.username;setAvatar($('meAvatar'),me)
      }
      if(foundUser?.id===data.user?.id){
        foundUser={...foundUser,...data.user};renderUserSearchResult(foundUser)
      }
      loadUsers().catch(()=>{});
      return
    }
    if(data.type==='contacts_updated'){
      loadUsers().catch(()=>{});
      return
    }
    if(data.type==='message'){
      const m=data.message;
      if(active?.type==='user'&&(m.sender_id===active.data.id||m.recipient_id===active.data.id)){
        appendMessage(m);
        if(m.sender_id===active.data.id){
          api('/api/messages/'+active.data.id).then(renderMessages).catch(()=>{})
        }
      }
      loadUsers().catch(()=>{})
    }
    if(data.type==='read_receipt'){
      if(active?.type==='user'&&data.reader_id===active.data.id){
        for(const id of data.message_ids||[]){
          const bubble=document.querySelector('.bubble[data-message-id="'+id+'"]');
          const receipt=bubble?.querySelector('.receipt');
          if(receipt){receipt.textContent='✓✓ прочитано';receipt.classList.add('read')}
        }
      }
    }
    if(data.type==='group_message'){
      const m=data.message;
      if(active?.type==='group'&&m.group_id===active.data.id)appendMessage(m);
      loadGroups().catch(()=>{})
    }
    if(data.type==='group_created')loadGroups().catch(()=>{})
  };
  socket.onclose=()=>{if(currentCall||pendingCall)finishCall(false);clearTimeout(retry);if(token)retry=setTimeout(connectWs,2500)}
}

  try{
    const g=await api('/api/groups',{method:'POST',body:{name,member_ids}});
    $('groupDialog').close();await loadGroups();await openGroup(g)
  }catch(err){$('groupError').textContent=err.message}
};

$('meAvatar').onclick=()=>{$('avatarInput').click()};
$('avatarInput').onchange=async()=>{
  const file=$('avatarInput').files?.[0];
  $('avatarInput').value='';
  if(!file)return;
  if(file.size>5*1024*1024){alert('Аватар должен быть не больше 5 МБ');return}
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('Выбери JPEG, PNG или WebP');return}
  const form=new FormData();form.append('file',file);
  $('meAvatar').disabled=true;
  try{
    const r=await fetch('/api/me/avatar',{
      method:'POST',
      headers:{Authorization:'Bearer '+token},
      body:form
    });
    let data=null;try{data=await r.json()}catch{}
    if(!r.ok)throw new Error(data?.detail||'Не удалось загрузить аватар');
    me=data;setAvatar($('meAvatar'),me);
    await loadUsers()
  }catch(err){alert(err.message||'Не удалось загрузить аватар')}
  finally{$('meAvatar').disabled=false}
};

$('logout').onclick=async()=>{if(groupCallState)leaveGroupCall(true);if(currentCall||pendingCall)finishCall(true);await removePushSubscription();try{await api('/api/logout',{method:'POST'})}catch{}token='';localStorage.removeItem('svoi_token');showAuth()};
$('back').onclick=()=>{$('app').classList.remove('chat-open')};

if(token)enter();else showAuth();
</script></body></html>
