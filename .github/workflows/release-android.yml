name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (leave the suggested next value when running manually)"
        required: true
        type: string
      version_name:
        description: "Version name, e.g. 1.0.10"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/release-android.yml"

concurrency:
  group: svoi-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed Svoi APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    env:
      SVOI_KEYSTORE_PATH: ${{ github.workspace }}/android-app/android/app/svoi-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION_CODE: ${{ inputs.version_code }}
          MANUAL_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          EXISTING_TAG=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_CODE="$MANUAL_VERSION_CODE"
            VERSION_NAME="$MANUAL_VERSION_NAME"
          else
            git fetch --tags --force >/dev/null 2>&1 || true
            EXISTING_TAG="$(
              git tag --points-at "$GITHUB_SHA" --list 'android-v*' \
              | sed -n 's/^android-v\([0-9][0-9]*\)$/android-v\1/p' \
              | sort -t v -k 2,2n \
              | tail -n 1
            )"

            if [ -n "$EXISTING_TAG" ]; then
              VERSION_CODE="${EXISTING_TAG#android-v}"
            else
              LATEST_CODE="$(
                gh release list \
                  --repo "${{ github.repository }}" \
                  --limit 100 \
                  --json tagName \
                  --jq '.[].tagName' \
                | sed -n 's/^android-v\([0-9][0-9]*\)$/\1/p' \
                | sort -n \
                | tail -n 1
              )"

              if [ -z "$LATEST_CODE" ]; then
                LATEST_CODE=1
              fi

              VERSION_CODE=$((LATEST_CODE + 1))
            fi

            PATCH=$((VERSION_CODE - 2))
            if [ "$PATCH" -lt 0 ]; then
              PATCH=0
            fi
            VERSION_NAME="1.0.$PATCH"
          fi

          case "$VERSION_CODE" in
            ''|*[!0-9]*)
              echo "::error::versionCode must be a positive integer"
              exit 1
              ;;
          esac

          if [ "$VERSION_CODE" -lt 1 ]; then
            echo "::error::versionCode must be at least 1"
            exit 1
          fi

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::versionName must not be empty"
            exit 1
          fi

          TAG="android-v$VERSION_CODE"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "$EXISTING_TAG" = "$TAG" ]; then
              echo "Release $TAG already belongs to this commit; duplicate run will reuse it."
            else
              echo "::error::Release $TAG already exists"
              exit 1
            fi
          fi

          printf 'SVOI_VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          printf 'SVOI_VERSION_NAME=%s\n' "$VERSION_NAME" >> "$GITHUB_ENV"
          printf 'SVOI_RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"

          echo "Resolved Android release: $TAG / $VERSION_NAME"

      - name: Restore signing key and build signed release APK
        shell: bash
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +x

          KEYSTORE_B64="${RAW_KEYSTORE_BASE64#ANDROID_KEYSTORE_BASE64=}"
          KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"

          STORE_PASS="${RAW_KEYSTORE_PASSWORD#ANDROID_KEYSTORE_PASSWORD=}"
          STORE_PASS="$(printf '%s' "$STORE_PASS" | tr -d '\r\n')"

          KEY_ALIAS="${RAW_KEY_ALIAS#ANDROID_KEY_ALIAS=}"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"

          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"

          echo "::add-mask::$KEYSTORE_B64"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_ALIAS"

          printf '%s' "$KEYSTORE_B64" | base64 -d > "$SVOI_KEYSTORE_PATH"

          keytool -list \
            -keystore "$SVOI_KEYSTORE_PATH" \
            -storepass "$STORE_PASS" >/dev/null

          keytool -list \
            -keystore "$SVOI_KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" >/dev/null

          export SVOI_KEYSTORE_PASSWORD="$STORE_PASS"
          export SVOI_KEY_ALIAS="$KEY_ALIAS"
          export SVOI_KEY_PASSWORD="$STORE_PASS"

          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../svoi.apk

          rm -f "$SVOI_KEYSTORE_PATH"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs svoi.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: svoi-android-release-${{ env.SVOI_VERSION_CODE }}
          path: android-app/svoi.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$SVOI_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $SVOI_RELEASE_TAG already exists for this commit; skipping duplicate publication."
            exit 0
          fi

          gh release create "$SVOI_RELEASE_TAG" svoi.apk \
            --repo "${{ github.repository }}" \
            --title "Свои Android $SVOI_VERSION_NAME" \
            --notes "Автоматическая Android-сборка $SVOI_VERSION_NAME (versionCode $SVOI_VERSION_CODE). Commit: ${GITHUB_SHA}." \
            --latest
