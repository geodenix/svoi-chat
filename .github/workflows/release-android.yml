name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (leave the suggested next value when running manually)"
        required: true
        type: string
      version_name:
        description: "Version name, e.g. 1.0.10"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/release-android.yml"

concurrency:
  group: svoi-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed Svoi APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    env:
      SVOI_KEYSTORE_PATH: ${{ github.workspace }}/android-app/android/app/svoi-release.jks
      RAW_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RAW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION_CODE: ${{ inputs.version_code }}
          MANUAL_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_CODE="$MANUAL_VERSION_CODE"
            VERSION_NAME="$MANUAL_VERSION_NAME"
          else
            LATEST_CODE="$(
              gh release list \
                --repo "${{ github.repository }}" \
                --limit 100 \
                --json tagName \
                --jq '.[].tagName' \
              | sed -n 's/^android-v\([0-9][0-9]*\)$/\1/p' \
              | sort -n \
              | tail -n 1
            )"

            if [ -z "$LATEST_CODE" ]; then
              LATEST_CODE=1
            fi

            VERSION_CODE=$((LATEST_CODE + 1))
            PATCH=$((VERSION_CODE - 2))
            if [ "$PATCH" -lt 0 ]; then
              PATCH=0
            fi
            VERSION_NAME="1.0.$PATCH"
          fi

          case "$VERSION_CODE" in
            ''|*[!0-9]*)
              echo "::error::versionCode must be a positive integer"
              exit 1
              ;;
          esac

          if [ "$VERSION_CODE" -lt 1 ]; then
            echo "::error::versionCode must be at least 1"
            exit 1
          fi

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::versionName must not be empty"
            exit 1
          fi

          TAG="android-v$VERSION_CODE"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

          printf 'SVOI_VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          printf 'SVOI_VERSION_NAME=%s\n' "$VERSION_NAME" >> "$GITHUB_ENV"
          printf 'SVOI_RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"

          echo "Resolved Android release: $TAG / $VERSION_NAME"

      - name: Normalize signing secrets
        shell: bash
        run: |
          set +x

          KEYSTORE_B64="${RAW_KEYSTORE_BASE64#ANDROID_KEYSTORE_BASE64=}"
          KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"

          STORE_PASS="${RAW_KEYSTORE_PASSWORD#ANDROID_KEYSTORE_PASSWORD=}"
          STORE_PASS="$(printf '%s' "$STORE_PASS" | tr -d '\r\n')"

          KEY_ALIAS="${RAW_KEY_ALIAS#ANDROID_KEY_ALIAS=}"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"

          KEY_PASS="$STORE_PASS"

          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"

          echo "::add-mask::$KEYSTORE_B64"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASS"

          printf 'SVOI_KEYSTORE_BASE64=%s\n' "$KEYSTORE_B64" >> "$GITHUB_ENV"
          printf 'SVOI_KEYSTORE_PASSWORD=%s\n' "$STORE_PASS" >> "$GITHUB_ENV"
          printf 'SVOI_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'SVOI_KEY_PASSWORD=%s\n' "$KEY_PASS" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android app
        run: |
          python3 patch_android.py
          python3 patch_release.py "$SVOI_VERSION_CODE" "$SVOI_VERSION_NAME"

      - name: Restore and verify signing key
        shell: bash
        run: |
          set +x

          if ! printf '%s' "$SVOI_KEYSTORE_BASE64" | base64 -d > "$SVOI_KEYSTORE_PATH"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is invalid"
            exit 1
          fi

          if ! keytool -list -keystore "$SVOI_KEYSTORE_PATH" -storepass "$SVOI_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not match the keystore, or the keystore data is wrong"
            exit 1
          fi

          if ! keytool -list -keystore "$SVOI_KEYSTORE_PATH" -storepass "$SVOI_KEYSTORE_PASSWORD" -alias "$SVOI_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS does not exist in the keystore"
            exit 1
          fi

          echo "Signing keystore verified successfully"

      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../svoi.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs svoi.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: svoi-android-release-${{ env.SVOI_VERSION_CODE }}
          path: android-app/svoi.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$SVOI_RELEASE_TAG" svoi.apk \
            --repo "${{ github.repository }}" \
            --title "Свои Android $SVOI_VERSION_NAME" \
            --notes "Автоматическая Android-сборка $SVOI_VERSION_NAME (versionCode $SVOI_VERSION_CODE)." \
            --latest
