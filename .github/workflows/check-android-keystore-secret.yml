name: Check Android Keystore Secret

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-android-keystore-secret.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RAW_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Diagnose secret format safely
        shell: bash
        run: |
          set +x
          test -n "$RAW_KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          }
          VALUE="${RAW_KEYSTORE_BASE64#ANDROID_KEYSTORE_BASE64=}"
          VALUE="$(printf '%s' "$VALUE" | tr -d '[:space:]')"
          echo "::add-mask::$VALUE"
          LEN=${#VALUE}
          MOD=$((LEN % 4))
          INVALID="$(printf '%s' "$VALUE" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')"
          echo "length=$LEN"
          echo "length_mod_4=$MOD"
          echo "invalid_character_count=$INVALID"
          printf '%s' "$VALUE" | base64 -d > /tmp/svoi-release.jks || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"
            exit 1
          }
          test -s /tmp/svoi-release.jks || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }
          echo "ANDROID_KEYSTORE_BASE64 is present and decodes successfully"
