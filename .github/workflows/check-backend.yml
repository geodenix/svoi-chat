name: Check Backend

on:
  push:
    paths:
      - "app.py"
      - "index.html"
      - "deploy.sh"
      - "requirements.txt"
      - ".github/workflows/check-backend.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m py_compile app.py

      - name: Check deploy script
        run: bash -n deploy.sh

      - name: Check frontend JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(
              r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>",
              html,
              flags=re.IGNORECASE | re.DOTALL,
          )
          Path("/tmp/svoi-inline.js").write_text("\n".join(blocks), encoding="utf-8")
          PY
          node --check /tmp/svoi-inline.js

      - name: Initialize clean database
        env:
          SVOI_DATA_DIR: /tmp/svoi-smoke
        run: |
          python - <<'PY'
          import app
          app.init_db()
          print("BACKEND_SMOKE_OK")
          PY
