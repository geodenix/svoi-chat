name: Check Backend

on:
  push:
    paths:
      - "app.py"
      - "app.js"
      - "index.html"
      - "deploy.sh"
      - "svoi-chat.service"
      - "setup_livekit.py"
      - "setup_push.py"
      - "setup_turn.py"
      - "requirements.txt"
      - "requirements.lock.txt"
      - "android-app/package-lock.json"
      - ".github/workflows/check-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      - name: Compile backend and setup scripts
        run: |
          python -m py_compile app.py
          python -m py_compile setup_livekit.py setup_push.py setup_turn.py

      - name: Validate Android lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix android-app

      - name: Check deploy script
        run: bash -n deploy.sh

      - name: Check frontend JavaScript
        run: |
          node --check app.js
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(
              r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>",
              html,
              flags=re.IGNORECASE | re.DOTALL,
          )
          Path("/tmp/svoi-inline.js").write_text("\n".join(blocks), encoding="utf-8")
          PY
          node --check /tmp/svoi-inline.js

      - name: Initialize clean database
        env:
          SVOI_DATA_DIR: /tmp/svoi-smoke
        run: |
          python - <<'PY'
          import app
          app.init_db()
          print("BACKEND_SMOKE_OK")
          PY
