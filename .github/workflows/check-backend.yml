name: Check Backend

on:
  push:
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/check-backend.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m py_compile app.py

      - name: Initialize clean database
        env:
          SVOI_DATA_DIR: /tmp/svoi-smoke
        run: |
          python - <<'PY'
          import app
          app.init_db()
          print("BACKEND_SMOKE_OK")
          PY
