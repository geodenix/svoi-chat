name: Check screen-share removal

on:
  push:
    branches:
      - remove-screen-sharing

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile app.py android-app/patch_android.py

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text()
          scripts = []
          for match in re.finditer(r"<script([^>]*)>([\s\S]*?)</script>", html, re.I):
              attrs, body = match.group(1), match.group(2)
              if re.search(r"\bsrc\s*=", attrs, re.I):
                  continue
              scripts.append(body)

          if not scripts:
              raise SystemExit("No inline scripts found")

          Path("/tmp/svoi-inline.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/svoi-inline.js
